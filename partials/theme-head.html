<!-- The theme before first paint: the cookie Teamtrail Cloud shares (tt_theme), else this site's own choice, else night. src/theme.ts writes both. -->
<script>
  try {
    var m = document.cookie.match(/(?:^|; )tt_theme=(light|dark)(?:;|$)/),
      t = m ? (m[1] === 'light' ? 'day' : 'night') : localStorage.getItem('teamtrail-theme');
    document.documentElement.dataset.theme = t === 'day' ? 'day' : 'night';
  } catch (e) {
    document.documentElement.dataset.theme = 'night';
  }
</script>
