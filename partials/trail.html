<!--
  Home hero's trail, behind the copy: blaze in square steps along the sides and the strip above the video,
  through junctions (solid: passed; hollow: waiting) and paths not taken (dashed), to the destination's ringed dot.
  Coordinates are percent of the hero (x doubled in the wide one, so a unit is about square at 1440px); styles.css
  stretches it over the hero and keeps strokes and dots their pixel size. The line draws itself once on load through
  its mask (a dash would be measured in pixels there, so the mask's stroke walks instead).
  Wide from 1100px, around the headline; narrow below, only in the strip under the buttons.
-->

  <mask id="trail-wide-walk" maskUnits="userSpaceOnUse" x="-10" y="-10" width="220" height="120">
    <path class="trail__walk" pathLength="1" d="M-2 30H16V52H28V93H172V60H188" />
  </mask>
  <path class="trail__line" mask="url(#trail-wide-walk)" d="M-2 30H16V52H28V93H172V60H188" />
