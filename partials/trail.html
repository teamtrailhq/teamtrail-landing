<!--
  Home hero's trail, behind the copy: blaze in square steps along the sides and the strip above the video,
  through junctions (solid: passed; hollow: waiting) and paths not taken (dashed). The wide one spans the screen: in
  from the left edge, and at the junction right of the lede it forks, out across the right margin to the right edge
  and down the video's right side (partials/trailvideo.html), where the destination is. The narrow one ends in the
  strip.
  Coordinates are percent of the box (x doubled in the wide one). styles.css stretches it over the hero, the wide
  one exactly as wide as the video's frame plus 24px a side, so it lines up with the video's trail, and keeps
  strokes and dots their pixel size. Masks do the moving, since a dash would be measured in pixels on the line
  itself: the line draws once on load, then pulses walk it for good (each mask's dash, one period per loop).
  Wide from 1100px; narrow below, only in the strip under the buttons.
-->
