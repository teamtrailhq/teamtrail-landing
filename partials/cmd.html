<div
  class="cmd"
  data-cycle="npx teamtrail::Start at the trailhead|npx teamtrail connect claude::Then connect Claude Code|npx teamtrail connect codex::Or connect Codex"
>
  <span class="cmd__label">Start at the trailhead</span>
  <span class="cmd__line"
    ><span class="prompt" aria-hidden="true">$</span> <span class="cmd__text">npx teamtrail</span
    ><span class="cmd__caret" aria-hidden="true"></span
  ></span>
  <button class="copy" type="button" data-copy="npx teamtrail" aria-label="Copy the command">
    <svg class="ico i-copy" viewBox="0 0 20 20" aria-hidden="true">
      <rect x="6.5" y="6.5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M13.5 3.5h-10v10" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
    <svg class="ico i-check" viewBox="0 0 20 20" aria-hidden="true">
      <path d="m4 10.5 4 4 8-9" fill="none" stroke="currentColor" stroke-width="1.8" />
    </svg>
  </button>
</div>
