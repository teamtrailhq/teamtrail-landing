  to the destination under its corner; on the left, the path not taken goes a way down and back. Behind the frame,
  never over the video. Same x as the hero's wide trail (the frame plus 24px a side), y percent of the frame plus
  56px under it. Its pulses leave the hero's trail exactly as they arrive here (styles.css).
-->

  <path class="trail__line" d="M198 0V97.2H184" />
  <path class="trail__pulse" mask="url(#trail-video-pulse)" d="M198 0V97.2H184" />
  <path class="trail__node" d="M198 45h0" />
  <path class="trail__flash trail__at-7" d="M198 45h0" />
  <path class="trail__ring trail__at-8" d="M184 97.2h0" />
