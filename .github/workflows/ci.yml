# Typecheck and build on every push and PR. The Scout avatar comes from the product repo, checked out next to this one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
        with:
          path: landing
      - uses: actions/checkout@v4
        with:
          repository: teamtrailhq/teamtrail
          path: teamtrail
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
