# Deploys the landing to Vercel with the Vercel CLI. Pushes to main deploy production; PRs get a preview URL
# posted as a comment. The Scout avatar comes from the product repo, checked out next to this one.
# Secrets: VERCEL_TOKEN (vercel.com/account/tokens), VERCEL_ORG_ID, VERCEL_PROJECT_ID (.vercel/project.json).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Vercel token set?
        id: ready
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::VERCEL_TOKEN is not set; skipping the deploy."; fi
        working-directory: .
      - if: steps.ready.outputs.ok
        uses: actions/checkout@v4
        with:
          path: landing
      - if: steps.ready.outputs.ok
        uses: actions/checkout@v4
        with:
          repository: teamtrailhq/teamtrail
          path: teamtrail
      - if: steps.ready.outputs.ok
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - if: steps.ready.outputs.ok
        run: npm ci
      - if: steps.ready.outputs.ok
        name: Target
        id: target
        run: echo "env=${{ github.event_name == 'pull_request' && 'preview' || 'production' }}" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok
        run: npx vercel@latest pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}
      - if: steps.ready.outputs.ok
        run: npx vercel@latest build ${{ steps.target.outputs.env == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - if: steps.ready.outputs.ok
        name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prebuilt ${{ steps.target.outputs.env == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL
        if: steps.ready.outputs.ok && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Landing preview → ${{ steps.deploy.outputs.url }}"
